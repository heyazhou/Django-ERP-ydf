{% extends "cnc/mobile/base.html" %}
{% block title %}待检{% endblock %}
{% block content %}
<div class="card">
  <h2>进行中的检验</h2>
  {% for record in records %}
    <div class="row">
      <a href="{% url 'quality_check' record.pk %}">{{ record.code }} {{ record.get_stage_display }}</a>
      <span>{{ record.get_result_display }}</span>
    </div>
  {% empty %}
    <div>当前没有进行中的检验。</div>
  {% endfor %}
</div>
{% endblock %}
